name: API Automation
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to run
        type: choice
        options: [dev, qa]
        default: dev
      suite:
        description: Test suite
        type: choice
        options: [smoke, regression]
        default: smoke
  pull_request:          # smoke on dev
  schedule:
    - cron: '0 18 * * *' # regression on qa, scheduled (UTC)

permissions:
  contents: read

concurrency:
  # Only one run per environment at a time; queue instead of cancelling, so no run leaves data uncleaned
  group: api-tests-${{ inputs.env || (github.event_name == 'schedule' && 'qa') || 'dev' }}
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub Environments 'dev' and 'qa': each has its own secrets, same variable names
    environment: ${{ inputs.env || (github.event_name == 'schedule' && 'qa') || 'dev' }}
    env:
      CI: 'true'
      TEST_ENV: ${{ inputs.env || (github.event_name == 'schedule' && 'qa') || 'dev' }}
      # URL lives in config/environments/<env>.env; CI only passes the secret
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_EMAIL_READONLY: ${{ secrets.TEST_USER_EMAIL_READONLY }}
      AUTH_TEST_OTP: ${{ secrets.AUTH_TEST_OTP }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # LTS version standardized by the team
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:env:${{ env.TEST_ENV }}
      - name: Run tests
        run: npm run test:${{ inputs.suite || (github.event_name == 'schedule' && 'regression') || 'smoke' }}:${{ env.TEST_ENV }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports-${{ env.TEST_ENV }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14