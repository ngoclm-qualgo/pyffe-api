info:
  title: Safenest Auth Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/auth-service/health:
    get:
      operationId: get-auth-service-health-check
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckGetResponseBody"
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumaErrorResponse"
          description: Internal Server Error
      security:
        - {}
      summary: Get Auth Service Health Check
      tags:
        - default
    head:
      operationId: head-auth-service-health-check
      responses:
        "200":
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumaErrorResponse"
          description: Internal Server Error
      security:
        - {}
      summary: Head Auth Service Health Check
      tags:
        - default
