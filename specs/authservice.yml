components:
  schemas:
    AccountDeletionBlockedFamily:
      additionalProperties: true
      properties:
        familyId:
          examples:
            - 018f4c6e-7b3a-73f7-8000-000000000001
          type: string
        linkedDevices:
          items:
            $ref: "#/components/schemas/AccountDeletionLinkedDevice"
          type:
            - array
            - "null"
        name:
          examples:
            - My Family
          type: string
      required:
        - familyId
        - linkedDevices
      type: object
    AccountDeletionEligibilityResponseBody:
      additionalProperties: true
      properties:
        blockedFamilies:
          items:
            $ref: "#/components/schemas/AccountDeletionBlockedFamily"
          type:
            - array
            - "null"
        confirmationMethod:
          examples:
            - EMAIL
          type: string
        redactedEmail:
          examples:
            - joh***@gmail.com
          type: string
        status:
          examples:
            - ELIGIBLE
          type: string
      required:
        - status
      type: object
    AccountDeletionLinkedDevice:
      additionalProperties: true
      properties:
        deviceId:
          examples:
            - 018f4c6e-7b3a-73f7-8000-000000000004
          type: string
        deviceName:
          examples:
            - Pixel 8 Pro
          type: string
      required:
        - deviceId
      type: object
    AuthChallengeRequest:
      additionalProperties: true
      properties:
        authFlow:
          enum:
            - ONBOARDING
            - SESSION_APPROVAL
            - REFRESH_TOKEN
            - DELETE_ACCOUNT_REQUEST
            - DELETE_ACCOUNT
          examples:
            - ONBOARDING
          type: string
        challengeName:
          enum:
            - INIT_CHALLENGE
            - TERM_CONDITION
            - EMAIL_OTP_REQUIRED
            - VERIFY_SSO_PROVIDER_REQUIRED
            - CODE_CHALLENGE
            - RESEND_OTP
            - DELETE_ACCOUNT_CONFIRMATION
            - QR_TOKEN_ISSUED_CHECKING
            - QR_LOGIN_REQUIRED
            - PARING_CODE_TOKEN_ISSUED_CHECKING
            - PARING_CODE_LOGIN_REQUIRED
          examples:
            - INIT_CHALLENGE
          type: string
        challengeResponses:
          additionalProperties: {}
          type: object
        clientMetadata:
          additionalProperties: {}
          type: object
        session:
          examples:
            - session_1234567890
          type: string
      required:
        - authFlow
        - challengeName
        - clientMetadata
      type: object
    AuthChallengeResponse:
      additionalProperties: true
      properties:
        authFlow:
          enum:
            - LOGIN
            - SESSION_APPROVAL
            - REFRESH_TOKEN
            - DELETE_ACCOUNT_REQUEST
            - DELETE_ACCOUNT
          examples:
            - LOGIN
          type: string
        challengeName:
          enum:
            - INIT_CHALLENGE
            - TERM_CONDITION
            - EMAIL_OTP_REQUIRED
            - VERIFY_SSO_PROVIDER_REQUIRED
            - CODE_CHALLENGE
            - RESEND_OTP
            - DELETE_ACCOUNT_CONFIRMATION
            - QR_TOKEN_ISSUED_CHECKING
            - QR_LOGIN_REQUIRED
            - PARING_CODE_TOKEN_ISSUED_CHECKING
            - PARING_CODE_LOGIN_REQUIRED
          examples:
            - INIT_CHALLENGE
          type: string
        challengeParameters:
          additionalProperties: {}
          type: object
        result: {}
        session:
          examples:
            - session_1234567890
          type: string
      required:
        - authFlow
        - challengeName
      type: object
    AuthTokens:
      additionalProperties: true
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
      type: object
    CreateUserPayload:
      additionalProperties: true
      properties:
        email:
          type: string
        name:
          examples:
            - John Doe
          minLength: 1
          type: string
        password:
          type: string
      required:
        - name
        - email
        - password
      type: object
    HealthCheckGetResponseBody:
      additionalProperties: true
      properties:
        status:
          type: string
      required:
        - status
      type: object
    HumaErrorResponse:
      additionalProperties: true
      properties:
        detail:
          examples:
            - The request was invalid
          type: string
        errorCode:
          examples:
            - INVALID_REQUEST
          type: string
        errorParams:
          additionalProperties:
            type: string
          examples:
            - name: Name is required
          type: object
        title:
          examples:
            - Bad Request
          type: string
      required:
        - title
        - detail
        - errorCode
      type: object
    LogoutResponse:
      additionalProperties: true
      properties:
        message:
          type: string
      required:
        - message
      type: object
    NotificationPreferenceResponse:
      additionalProperties: true
      properties:
        communityAlertsEnabled:
          examples:
            - true
          type: boolean
        deviceId:
          examples:
            - 019cd67c-59ff-7b2a-b8a6-b1fc47b32664
          type: string
        familyAlertsMode:
          enum:
            - ALL
            - CRITICAL_ONLY
          examples:
            - ALL
          type: string
        frequencyMode:
          enum:
            - IMMEDIATE
            - DAILY_SUMMARY
          examples:
            - IMMEDIATE
          type: string
        id:
          examples:
            - 019cd67c-59ff-7b2a-b8a6-b1fc47b32664
          type: string
        productUpdatesEnabled:
          examples:
            - true
          type: boolean
        uniqueDeviceId:
          examples:
            - device_1234567890
          type: string
        updatedAt:
          examples:
            - "2026-04-17T10:30:00Z"
          format: date-time
          type: string
        userId:
          examples:
            - 019cd67c-59ff-7b2a-b8a6-b1fc47b32664
          type: string
      required:
        - id
        - userId
        - deviceId
        - uniqueDeviceId
        - productUpdatesEnabled
        - communityAlertsEnabled
        - familyAlertsMode
        - frequencyMode
        - updatedAt
      type: object
    RefreshTokenPayload:
      additionalProperties: true
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
      type: object
    RegisterFcmTokenPayload:
      additionalProperties: true
