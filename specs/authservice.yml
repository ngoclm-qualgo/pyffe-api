            - string
            - "null"
        createdAt:
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
        email:
          examples:
            - joh****@example.com
          type: string
        id:
          examples:
            - 123e4567-e89b-12d3-a456-426614174000
          type: string
        lastLoginAt:
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type:
            - string
            - "null"
        provider:
          examples:
            - GOOGLE
          type:
            - string
            - "null"
        status:
          examples:
            - ACTIVE
          type: string
        updatedAt:
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
      required:
        - id
        - email
        - status
        - createdAt
        - updatedAt
      type: object
    User201:
      additionalProperties: true
      properties:
        authClient:
          examples:
            - CONSUMER
          type:
            - string
            - "null"
        createdAt:
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
