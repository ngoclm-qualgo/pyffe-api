        appVersion:
          examples:
            - 1.0.0
          minLength: 1
          type: string
        fcmToken:
          examples:
            - fcm_token_1234567890
          minLength: 1
          type: string
        platform:
          enum:
            - IOS
            - ANDROID
          examples:
            - IOS
          type: string
        role:
          enum:
            - OWNER
            - MEMBER
          examples:
            - OWNER
          type:
            - string
            - "null"
      required:
        - fcmToken
        - appVersion
        - platform
      type: object
    ResponseStruct {}Body:
      additionalProperties: true
      type: object
    SaveNotificationPreferencePayload:
      additionalProperties: true
      properties:
        communityAlertsEnabled:
          examples:
            - true
          type: boolean
        familyAlertsMode:
          enum:
            - ALL
            - CRITICAL_ONLY
          examples:
            - ALL
          type: string
        frequencyMode:
          enum:
            - IMMEDIATE
            - DAILY_SUMMARY
          examples:
            - IMMEDIATE
          type: string
        productUpdatesEnabled:
          examples:
            - true
          type: boolean
      required:
        - productUpdatesEnabled
        - communityAlertsEnabled
        - familyAlertsMode
        - frequencyMode
      type: object
    SensitiveDataResponse:
      additionalProperties: true
      properties:
        accountEmail:
          type: string
        expiresAt:
          format: date-time
          type: string
        identifier:
          type: string
        otp:
          type: string
        otpExpiredTime:
          format: int64
          type: integer
        reason:
          type: string
        redactEmail:
          type: string
