  /api/v2/families/{id}/protection-statistics:
    get:
      description: Retrieve the last 7 days of protection statistics grouped by category. Each date is device-local midnight converted to its UTC instant; clients should convert it back using the requested timezone. The optional fixed UTC offset applies only to the default range; encode + as %2B. Custom from/to ranges ignore timezone. Stored UTC-day aggregates make counts near local midnight approximate, and fixed offsets do not model DST transitions. Missing days return totalCount 0 and an empty statistics list. Owners see all family devices and may filter by deviceId. Members only see their own device.
      operationId: get-protection-statistics-v2
      parameters:
        - in: header
          name: x-language
          schema:
            examples:
              - en
            type: string
        - in: header
          name: x-correlation-id
          schema:
            examples:
              - 6d9bb21c-f7f3-4a92-b90f-d8e00ee78ba0
            type: string
        - in: header
          name: x-device-id
          schema:
            examples:
              - 018f4c6e-7b3a-73f7-8000-000000000004
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "Owner-only: filter by family member device. Members always see their own device."
          explode: false
          in: query
          name: deviceId
          schema:
            description: "Owner-only: filter by family member device. Members always see their own device."
            type: string
        - description: Optional fixed UTC offset used for the default range, for example +07:00. Encode + as %2B. Ignored when from and to are supplied.
          explode: false
          in: query
          name: timezone
          schema:
            description: Optional fixed UTC offset used for the default range, for example +07:00. Encode + as %2B. Ignored when from and to are supplied.
            examples:
              - "+07:00"
            type: string
        - description: UTC range start. Must be supplied with to and cover the configured statistics window.
          explode: false
          in: query
          name: from
          schema:
            description: UTC range start. Must be supplied with to and cover the configured statistics window.
            format: date-time
            type: string
        - description: UTC range end. Must be supplied with from and cover the configured statistics window.
          explode: false
          in: query
          name: to
          schema:
            description: UTC range end. Must be supplied with from and cover the configured statistics window.
            format: date-time
            type: string
