          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProtectionStatisticsV2ResponseBody"
          description: OK
        "400":
          content:
            application/json:
              example:
                title: Bad Request
                detail: Validation error
                errorCode: VALIDATION_FAILED
              schema:
                properties:
                  detail:
                    type: string
                  errorCode:
                    type: string
                  errorParams:
                    additionalProperties:
                      anyOf:
                        - type: string
                        - properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          required:
                            - message
                            - errorCode
                          type: object
                    type: object
                  title:
                    type: string
                required:
                  - title
                  - detail
                  - errorCode
                type: object
          description: Bad Request
        "403":
          content:
            application/json:
              example:
                title: Forbidden
                detail: Subscription entitlement required
                errorCode: SUBSCRIPTION_ENTITLEMENT_REQUIRED
              schema:
                properties:
                  detail:
                    type: string
                  errorCode:
                    type: string
                  errorParams:
                    additionalProperties:
                      anyOf:
                        - type: string
                        - properties:
                            errorCode:
