components:
  schemas:
    ApprovalRequestCode201:
      additionalProperties: true
      properties:
        canRemindAfterSeconds:
          examples:
            - 1775796093
          format: int64
          type: integer
        code:
          examples:
            - "123456"
          type: string
        expiresAtSeconds:
          examples:
            - 1775796093
          format: int64
          type: integer
        numRequestRemaining:
          description: How many more JOIN pairing-code generations allowed for this device in the Redis window; null if unlimited or not JOIN
          examples:
            - 3
          format: int64
          type: integer
        requestId:
          examples:
            - 018f4c6e-7b3a-73f7-8000-000000000001
          type: string
      type: object
    CompanionDeviceStatus200:
