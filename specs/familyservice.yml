          type: string
        deviceName:
          examples:
            - Pixel 8 Pro
          type: string
        devicePlatform:
          enum:
            - ios
            - android
          examples:
            - android
          type: string
        deviceSetupStatus:
          enum:
            - PENDING
            - COMPLETED
          examples:
            - COMPLETED
          type: string
        deviceStatus:
          enum:
            - UNLINKED
            - PAIRING_PENDING
            - LINKED
            - ACTIVE
            - SUSPENDED
          examples:
            - LINKED
          type: string
        familyCreatedAt:
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
        familyId:
          examples:
            - 018f4c6e-7b3a-73f7-8000-000000000001
          type: string
        familyName:
          examples:
            - The Smith Family
          type: string
        featureCodes:
          examples:
            - - CALL_PROTECTION_NORMAL
              - SAFE_BROWSING
          items:
            type: string
          type: array
        pendingRequestId:
          examples:
            - 018f4c6e-7b3a-73f7-8000-000000000002
          type: string
        permissionStatus:
          enum:
            - NOT_GRANTED
            - PARTIAL
            - FULL_GRANTED
          examples:
            - FULL_GRANTED
          type: string
        planCode:
          examples:
            - premium
          type: string
        role:
          enum:
            - OWNER
            - MEMBER
          examples:
            - MEMBER
          type: string
        supportedLanguages:
          description: UPPERCASE codes from the active language mappings of the family country; defaults to [EN] when the device is not linked
          examples:
            - - EN
              - VI
          items:
            type: string
          type: array
      required:
        - deviceId
        - dataPlaneCode
        - deviceStatus
        - deviceSetupStatus
        - permissionStatus
        - role
        - featureCodes
        - supportedLanguages
      type: object
    CreateFamilyPayload:
      additionalProperties: true
      properties:
        countryCode:
          examples:
            - VN
          minLength: 2
          type: string
        name:
          examples:
            - The Smith Family
          maxLength: 32
          minLength: 2
          type: string
      required:
        - name
        - countryCode
      type: object
    CreateProtectionSignalData:
      additionalProperties: true
      properties:
        category:
          enum:
            - CALL
            - SMS
            - MESSAGE
            - BROWSING
          examples:
            - CALL
          type: string
        count:
          default: 1
          description: Increment amount; defaults to 1 when omitted or zero.
          format: int64
          type: integer
        engineMode:
          description: Scam engine mode that produced this statistic.
          enum:
            - ON_DEVICE
            - ON_CLOUD
          type: string
        eventAt:
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
        signalType:
          enum:
            - CALL_BLOCKED_FAMILY
            - CALL_BLOCKED_SCAM
            - CALL_BLOCKED_SPAM
            - CALL_IDENTIFIED_SCAM
            - CALL_IDENTIFIED_SPAM
            - SMS_SCAM_DETECTED
            - SMS_SPAM_DETECTED
            - SMS_SCAM_FILTERED
            - SMS_SPAM_FILTERED
            - BROWSING_BLOCKED_SCAM
            - BROWSING_BLOCKED_SUSPICIOUS
            - BROWSING_OVERRIDE
          type: string
      required:
        - signalType
        - category
        - engineMode
        - eventAt
      type: object
    CreateProtectionSignalPayload:
      additionalProperties: true
      properties:
        items:
          items:
            $ref: "#/components/schemas/CreateProtectionSignalData"
          minItems: 1
          type:
            - array
            - "null"
      required:
        - items
      type: object
    CreateScamAlertBody:
      additionalProperties: true
      properties:
        category:
          enum:
            - GENERAL
            - CALL
            - BROWSING
            - SMS
            - OTT
            - FAMILY
          examples:
            - GENERAL
          type: string
        eventAt:
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
        level:
          enum:
            - 1
            - 2
            - 3
            - 4
          examples:
            - 1
          format: int64
          type: integer
        payload:
          additionalProperties: true
          examples:
            - appName: Messages
          properties:
            appName:
              examples:
                - Messages
              type: string
            deviceName:
              examples:
                - Pixel 8
              type: string
            familyName:
              examples:
                - Smith Family
              type: string
            scamCheckResult:
              additionalProperties: true
              properties:
                confidence:
                  examples:
                    - 0.5
                  maximum: 1
                  minimum: 0
                  type: number
                keyFindings:
                  items:
                    additionalProperties: true
                    properties:
                      category:
                        examples:
                          - Reported Scam Sender
                        type: string
                      description:
                        examples:
                          - This sender has been reported for scam activity.
                        type: string
                    type: object
                  type: array
                modelType:
                  examples:
                    - DEVICE_ONLY
                  type: string
                modelVersion:
                  examples:
                    - 20260730-001
                  type: string
                recommendation:
                  examples:
                    - Don't reply or share information.
                  type: string
                riskScore:
                  examples:
                    - 0.65
                  maximum: 1
                  minimum: 0
                  type: number
                verdict:
                  examples:
                    - SCAM
                  type: string
              type: object
          type: object
        scriptId:
          enum:
            - CALL_BLOCKED_FAMILY
            - CALL_BLOCKED_SCAM
            - CALL_BLOCKED_SPAM
            - CALL_BLOCKLIST_ADDED
            - SMS_SCAM
            - BROWSING_OVERRIDE
            - DEVICE_LEAVES_FAMILY
          examples:
            - CALL_BLOCKED_FAMILY
          type: string
      required:
        - scriptId
        - category
        - level
        - eventAt
      type: object
