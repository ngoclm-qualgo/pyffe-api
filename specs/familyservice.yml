info:
  title: family-service API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/companions/activities:
    get:
      description: Activity feed for the companion device. Items are empty until persistence is implemented. 403 FORBIDDEN if JWT role is not MEMBER or OWNER (middleware).
      operationId: list-companion-activities
      parameters:
        - in: header
          name: x-language
          schema:
            examples:
              - en
            type: string
        - in: header
          name: x-correlation-id
          schema:
            examples:
              - 6d9bb21c-f7f3-4a92-b90f-d8e00ee78ba0
            type: string
        - in: header
          name: x-device-id
          schema:
            examples:
              - 018f4c6e-7b3a-73f7-8000-000000000004
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyActivitiesList200"
          description: OK
        "401":
          content:
            application/json:
              example:
                title: Unauthorized
                detail: Unauthorized
                errorCode: UNAUTHORIZED
              schema:
                properties:
                  detail:
                    type: string
                  errorCode:
                    type: string
                  errorParams:
                    additionalProperties:
                      anyOf:
                        - type: string
                        - properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          required:
                            - message
                            - errorCode
                          type: object
                    type: object
                  title:
                    type: string
                required:
                  - title
                  - detail
                  - errorCode
                type: object
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                title: Forbidden
                detail: Forbidden
                errorCode: FORBIDDEN
              schema:
                properties:
                  detail:
                    type: string
                  errorCode:
                    type: string
                  errorParams:
                    additionalProperties:
                      anyOf:
                        - type: string
                        - properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          required:
                            - message
                            - errorCode
                          type: object
                    type: object
                  title:
                    type: string
                required:
                  - title
                  - detail
                  - errorCode
                type: object
          description: Forbidden
      security:
        - jwtAuth: []
      summary: List companion activities
      tags:
        - companion
  /api/v1/companions/devices/permissions:
    get:
      description: "Companion app only: active permission catalog with isEnabled from stored state for the JWT device. platformScope is APPLE, ANDROID, or ANY; OS filtering uses JWT device_information.brand."
      operationId: get-family-device-permissions
      parameters:
        - in: header
          name: x-language
          schema:
            examples:
              - en
            type: string
        - in: header
          name: x-correlation-id
          schema:
            examples:
              - 6d9bb21c-f7f3-4a92-b90f-d8e00ee78ba0
            type: string
        - in: header
          name: x-device-id
          schema:
            examples:
              - 018f4c6e-7b3a-73f7-8000-000000000004
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permissions200"
          description: OK
        "400":
          content:
            application/json:
              example:
                title: Bad Request
                detail: Validation error
                errorCode: VALIDATION_FAILED
              schema:
                properties:
                  detail:
                    type: string
                  errorCode:
                    type: string
                  errorParams:
                    additionalProperties:
                      anyOf:
                        - type: string
                        - properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          required:
                            - message
                            - errorCode
                          type: object
                    type: object
                  title:
                    type: string
                required:
                  - title
                  - detail
                  - errorCode
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                title: Unauthorized
                detail: Unauthorized
                errorCode: UNAUTHORIZED
              schema:
                properties:
                  detail:
                    type: string
                  errorCode:
                    type: string
                  errorParams:
                    additionalProperties:
                      anyOf:
                        - type: string
                        - properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          required:
                            - message
                            - errorCode
                          type: object
                    type: object
                  title:
                    type: string
                required:
                  - title
                  - detail
                  - errorCode
                type: object
          description: Unauthorized
      security:
        - jwtAuth: []
      summary: Get family device permissions
      tags:
        - family devices
    put:
      description: "Companion app only: upserts per-device rows for the JWT device and updates linked member permission_status when present. Body groups are CALL, COMMON, SAFE_BROWSING, and MESSAGE. The legacy SMS group is temporarily accepted and normalized to MESSAGE. Keys must be active and belong to the matching group."
      operationId: report-family-device-permissions
      parameters:
        - in: header
          name: x-language
          schema:
            examples:
              - en
            type: string
        - in: header
          name: x-correlation-id
          schema:
            examples:
              - 6d9bb21c-f7f3-4a92-b90f-d8e00ee78ba0
            type: string
        - in: header
          name: x-device-id
          schema:
            examples:
              - 018f4c6e-7b3a-73f7-8000-000000000004
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPermissionsPayload"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPermissions200"
          description: OK
        "400":
          content:
            application/json:
              example:
                title: Bad Request
                detail: Validation error
                errorCode: VALIDATION_FAILED
              schema:
                properties:
                  detail:
                    type: string
                  errorCode:
                    type: string
                  errorParams:
                    additionalProperties:
                      anyOf:
                        - type: string
                        - properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          required:
                            - message
                            - errorCode
                          type: object
                    type: object
                  title:
                    type: string
                required:
                  - title
                  - detail
                  - errorCode
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              example:
                title: Unauthorized
                detail: Unauthorized
                errorCode: UNAUTHORIZED
              schema:
                properties:
                  detail:
                    type: string
                  errorCode:
                    type: string
                  errorParams:
                    additionalProperties:
                      anyOf:
                        - type: string
                        - properties:
                            errorCode:
                              type: string
                            message:
                              type: string
                          required:
                            - message
                            - errorCode
                          type: object
                    type: object
                  title:
                    type: string
                required:
                  - title
                  - detail
                  - errorCode
                type: object
          description: Unauthorized
      security:
        - jwtAuth: []
      summary: Report family device permissions
      tags:
        - family devices
  /api/v1/companions/devices/scam-alerts:
    get:
      description: Lists scam alerts for the current companion device within the rolling 30-day eventAt window. The companion feed returns alert data even when owner scam-alert access is limited; clients should use isAccessLimited to apply access UI or policy.
      operationId: list-companion-scam-alerts
      parameters:
        - in: header
          name: x-language
          schema:
            examples:
              - en
            type: string
        - in: header
          name: x-correlation-id
          schema:
            examples:
              - 6d9bb21c-f7f3-4a92-b90f-d8e00ee78ba0
            type: string
        - in: header
          name: x-device-id
          schema:
            examples:
              - 018f4c6e-7b3a-73f7-8000-000000000004
            type: string
        - explode: false
          in: query
          name: originDeviceId
          schema:
            examples:
              - 018f4c6e-7b3a-73f7-8000-000000000002
            type: string
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - ACTIVE
              - RESOLVED
            examples:
              - ACTIVE
            type: string
        - explode: false
          in: query
          name: category
          schema:
            enum:
              - GENERAL
              - CALL
              - BROWSING
              - SMS
              - OTT
              - FAMILY
            examples:
              - GENERAL
            type: string
        - explode: false
          in: query
          name: pageSize
          schema:
            default: 10
            examples:
              - 10
            format: int64
            type: integer
        - explode: false
          in: query
          name: nextCursor
          schema:
            type: string
        - explode: false
          in: query
          name: previousCursor
          schema:
            type: string
        - description: Filter by eventAt start; clamped to the rolling 30-day window (zero means omitted)
          explode: false
          in: query
          name: from
          schema:
            description: Filter by eventAt start; clamped to the rolling 30-day window (zero means omitted)
            examples:
              - "2026-04-01T00:00:00Z"
            format: date-time
            type: string
        - description: Filter by eventAt end; clamped to the current time (zero means omitted)
          explode: false
          in: query
          name: to
          schema:
            description: Filter by eventAt end; clamped to the current time (zero means omitted)
            examples:
              - "2026-04-28T23:59:59Z"
            format: date-time
            type: string
